<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bloom For You 💐</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <div class="petals" aria-hidden="true"></div>

    <section class="bouquet-wrap" aria-label="Animated flower bouquet">
      <div class="bouquet" id="bouquet">

        <!-- Back foliage -->
        <div class="stem stem-1"></div><div class="leaf leaf-1"></div><div class="leaf leaf-2"></div>
        <div class="stem stem-2"></div><div class="leaf leaf-3"></div><div class="leaf leaf-4"></div>
        <div class="stem stem-3"></div><div class="leaf leaf-5"></div><div class="leaf leaf-6"></div>
        <div class="stem stem-4"></div><div class="leaf leaf-7"></div><div class="leaf leaf-8"></div>

        <!-- Flowers bloom one by one -->
        <div class="flower rose rose-1"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="core"></span></div>
        <div class="flower rose rose-2"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="core"></span></div>
        <div class="flower lily lily-1"><span class="lpetal a"></span><span class="lpetal b"></span><span class="lpetal c"></span><span class="lpetal d"></span><span class="lily-core"></span></div>
        <div class="flower daisy daisy-1"></div>
        <div class="flower daisy daisy-2"></div>
        <div class="flower lavender lav-1"></div>
        <div class="flower lavender lav-2"></div>
        <div class="flower rose rose-3"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="core"></span></div>
        <div class="flower carnation car-1"></div>
        <div class="flower daisy daisy-3"></div>
        <div class="flower rose rose-4"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="core"></span></div>
        <div class="flower lily lily-2"><span class="lpetal a"></span><span class="lpetal b"></span><span class="lpetal c"></span><span class="lpetal d"></span><span class="lily-core"></span></div>

        <!-- Small filler flowers -->
        <div class="filler f1"></div><div class="filler f2"></div><div class="filler f3"></div>
        <div class="filler f4"></div><div class="filler f5"></div><div class="filler f6"></div>

        <!-- Wrapping paper -->
        <div class="wrap wrap-back"></div>
        <div class="wrap wrap-front"></div>
        <div class="ribbon ribbon-left"></div>
        <div class="ribbon ribbon-right"></div>
        <div class="ribbon-knot"></div>

        <div class="tag">For You <span>♥</span></div>
      </div>
    </section>

    <div class="message">
      <div class="sparkle">✦</div>
      <h1>Just a little reminder...</h1>
      <p>You are so special <span>♥</span></p>
    </div>

    <button id="restart" type="button">Bloom Again ✿</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
